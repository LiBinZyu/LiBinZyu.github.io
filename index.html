<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李炳儒 Portfolio</title>

    <!-- Google Fonts: Inter for Latin + Noto Sans SC for Chinese -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">

    <!-- Three.js and Vanta.js (Deferred) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
</head>

<body class="theme-light">
    <!-- Vanta.js Birds Effect - Ambient Background -->
    <div id="vanta-birds" class="vanta-container"></div>

    <!-- Header with Profile (Original Layout: Bio first, Avatar + Name below) -->
    <header class="header">
        <div class="container">
            <div class="profile-section">
                <div class="profile-bio"></div>
                <div class="profile-meta">
                    <div class="profile-image">
                        <img src="assets/images/profile_life.png" alt="Profile Image" id="profile-img"
                            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 150 150\'%3E%3Ccircle cx=\'75\' cy=\'75\' r=\'75\' fill=\'%231D1D1F\'/%3E%3Ctext x=\'50%25\' y=\'55%25\' fill=\'white\' font-family=\'sans-serif\' font-size=\'32\' text-anchor=\'middle\' dominant-baseline=\'middle\'%3ELBZ%3C/text%3E%3C/svg%3E'">
                    </div>
                    <h1 class="profile-name" data-en="Bingru Li" data-zh="李炳儒">李炳儒</h1>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Menu: Apple Centered Floating Island Capsule (Icon-Only, Zero Border, No Text) -->
    <nav class="nav-menu">
        <div class="nav-capsule">
            <div class="nav-items">
                <button class="nav-item active" data-section="projects" data-tooltip-zh="项目" data-tooltip-en="Projects" data-tooltip="项目" aria-label="Projects">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/arcade.svg" alt="Projects" class="icon" width="18" height="18">
                </button>
                <button class="nav-item" data-section="experiences" data-tooltip-zh="经历" data-tooltip-en="Experience" data-tooltip="经历" aria-label="Experience">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/handbag.svg" alt="Experiences" class="icon" width="18" height="18">
                </button>
                <button class="nav-item" data-section="blog" data-tooltip-zh="文章" data-tooltip-en="Articles" data-tooltip="文章" aria-label="Articles">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/book.svg" alt="Blog" class="icon" width="18" height="18">
                </button>
                <button class="nav-item" data-section="contact" data-tooltip-zh="联系" data-tooltip-en="Contact" data-tooltip="联系" aria-label="Contact">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/send-mail.svg" alt="Contact" class="icon" width="18" height="18">
                </button>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-controls">
                <button class="btn nav-btn" id="download-cv" data-tooltip-zh="下载简历" data-tooltip-en="Download Resume" data-tooltip="下载简历" aria-label="Resume">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/cloud-download.svg" class="icon" width="18" height="18">
                </button>
                <button class="btn nav-btn" id="theme-toggle" data-tooltip-zh="深浅外观" data-tooltip-en="Appearance" data-tooltip="深浅外观" aria-label="Theme">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/half-moon.svg" class="icon" width="18" height="18">
                </button>
                <button class="btn nav-btn" id="language-toggle" data-tooltip-zh="中 / EN" data-tooltip-en="EN / 中" data-tooltip="中 / EN" aria-label="Language">
                    <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/translate.svg" class="icon" width="18" height="18">
                </button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="waterfall-container">
            <!-- Projects Section -->
            <section id="projects" class="content-section full-width-section">
                <div class="projects-toolbar">
                    <div class="category-filter-container">
                        <button class="filter-btn active" data-category="all">
                            <span data-en="All" data-zh="全部">全部</span>
                        </button>
                        <button class="filter-btn" data-category="spatial-xr">
                            <span data-en="Spatial & XR" data-zh="XR 空间计算">XR 空间计算</span>
                        </button>
                        <button class="filter-btn" data-category="3d-tech-art">
                            <span data-en="3D Art" data-zh="3D">3D</span>
                        </button>
                        <button class="filter-btn" data-category="ai-software">
                            <span data-en="AI" data-zh="AI">AI</span>
                        </button>
                        <button class="filter-btn" data-category="research">
                            <span data-en="Research" data-zh="学术研究">学术研究</span>
                        </button>
                    </div>
                    <div class="view-switch-capsule">
                        <button class="view-switch-btn" data-view="table" data-tooltip-zh="表格视图" data-tooltip-en="List View" data-tooltip="表格视图" aria-label="Table View">
                            <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/menu.svg" class="icon" width="16" height="16">
                        </button>
                        <button class="view-switch-btn active" data-view="grid" data-tooltip-zh="卡片网格" data-tooltip-en="Grid View" data-tooltip="卡片网格" aria-label="Grid View">
                            <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/view-grid.svg" class="icon" width="16" height="16">
                        </button>
                    </div>
                </div>
                <div class="projects-container" id="projects-content">
                    <!-- Loaded dynamically -->
                </div>
            </section>

            <!-- Experiences Section -->
            <section id="experiences" class="content-section full-width-section">
                <div class="experiences-timeline" id="experiences-content">
                    <!-- Loaded dynamically -->
                </div>
            </section>

            <!-- Blog Section -->
            <section id="blog" class="content-section full-width-section">
                <div class="blog-list" id="blogs-content">
                    <!-- Loaded dynamically -->
                </div>
            </section>

            <!-- Contact Section -->
            <section id="contact" class="content-section full-width-section">
                <div class="contact-content">
                    <div class="contact-card-panel">
                        <div class="contact-info" id="contact-info-list">
                            <!-- Loaded dynamically with visionOS grouped table (Zero Icons) -->
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="project-modal" class="project-modal">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close" aria-label="Close">
                <img src="https://cdn.jsdelivr.net/npm/iconoir@latest/icons/cancel.svg" alt="Close" class="icon"
                    width="18" height="18">
            </button>
            <div class="modal-media" id="modal-media"></div>
            <div class="modal-info">
                <h2 class="modal-title" id="modal-title"></h2>
                <p class="modal-description" id="modal-description"></p>
                <div class="tech-tags" id="modal-tech"></div>
                <div class="project-links" id="modal-links"></div>
            </div>
        </div>
    </div>

    <!-- Footer Spacer -->
    <footer class="footer"></footer>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>

    <!-- Vanta.js Birds Effect -->
    <script>
        let vantaEffect = null;

        // Original Blue-Purple Vanta Birds Dynamic Color Schemes
        const lightThemeColors = {
            color1: 0x8d9aeb,
            color2: 0x465bff,
            speedLimit: 5.00
        };

        const darkThemeColors = {
            color1: 0x372b6e,
            color2: 0x142455,
            speedLimit: 4.00
        };

        function initVantaEffect() {
            if (typeof VANTA === 'undefined' || !VANTA.BIRDS) {
                window.addEventListener('load', function () {
                    if (typeof VANTA !== 'undefined' && VANTA.BIRDS) {
                        initVantaEffect();
                    }
                }, { once: true });
                return;
            }

            const isDarkTheme = document.body.classList.contains('theme-dark') || document.documentElement.classList.contains('theme-dark');
            const colors = isDarkTheme ? darkThemeColors : lightThemeColors;

            if (vantaEffect) {
                try { vantaEffect.destroy(); } catch (err) {}
            }

            try {
                vantaEffect = VANTA.BIRDS({
                    el: "#vanta-birds",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.00,
                    minWidth: 200.00,
                    scale: 1.00,
                    scaleMobile: 1.00,
                    backgroundAlpha: 0.00,
                    ...colors
                });
            } catch (e) {
                console.warn('Vanta initialization skipped:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            initVantaEffect();
        });

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function () {
                setTimeout(() => {
                    initVantaEffect();
                }, 100);
            });
        }

        // Scroll Spy and Smooth Scroll
        function initScrollSpy() {
            const navItems = document.querySelectorAll('.nav-item');
            const sections = document.querySelectorAll('.full-width-section');

            let isSmoothScrolling = false;
            let scrollTimeout;

            function smoothScrollTo(targetId) {
                isSmoothScrolling = true;
                navItems.forEach(item => item.classList.remove('active'));
                const clickedItem = document.querySelector(`[data-section="${targetId}"]`);
                if (clickedItem) clickedItem.classList.add('active');

                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    const nav = document.querySelector('.nav-menu');
                    const navHeight = nav ? nav.getBoundingClientRect().height + 30 : 70;
                    const offsetTop = targetElement.getBoundingClientRect().top + window.scrollY - navHeight;
                    window.scrollTo({
                        top: offsetTop,
                        behavior: 'smooth'
                    });
                }
            }

            function updateActiveNav() {
                if (isSmoothScrolling) return;
                const scrollPos = window.scrollY + 180;

                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    const sectionHeight = section.offsetHeight;
                    const sectionId = section.getAttribute('id');

                    if (scrollPos >= sectionTop && scrollPos < sectionTop + sectionHeight) {
                        navItems.forEach(item => item.classList.remove('active'));
                        const activeNavItem = document.querySelector(`[data-section="${sectionId}"]`);
                        if (activeNavItem) {
                            activeNavItem.classList.add('active');
                        }
                    }
                });
            }

            navItems.forEach(item => {
                item.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetSection = this.getAttribute('data-section');
                    smoothScrollTo(targetSection);
                });
            });

            window.addEventListener('scroll', () => {
                if (isSmoothScrolling) {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        isSmoothScrolling = false;
                        updateActiveNav();
                    }, 100);
                } else {
                    updateActiveNav();
                }
            }, { passive: true });

            updateActiveNav();
        }

        document.addEventListener('DOMContentLoaded', function () {
            initScrollSpy();
        });
    </script>
</body>

</html>
